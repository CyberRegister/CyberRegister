version = 1

# Everything in this repository is the project's own work under MIT, unless a
# more specific annotation below says otherwise.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Anne Jan Brouwer and the CyberRegister contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "**.md"
precedence = "aggregate"
SPDX-FileCopyrightText = "Anne Jan Brouwer and the CyberRegister contributors"
SPDX-License-Identifier = "CC0-1.0"

# Generated by Composer and Yarn rather than written, so placed in the public
# domain to keep the dependency graph free of licence claims.
[[annotations]]
path = ["composer.lock", "yarn.lock"]
precedence = "aggregate"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

# Google's two step verification security key illustration, originally loaded
# from ssl.gstatic.com. No redistribution licence is recorded for it.
[[annotations]]
path = "public/static/Challenge_2SV-Gnubby_graphic.png"
precedence = "aggregate"
SPDX-FileCopyrightText = "Google LLC"
SPDX-License-Identifier = "LicenseRef-Unverified-Provenance"

# Views published from the Laravel framework and first party packages.
[[annotations]]
path = ["resources/views/vendor/mail/**", "resources/views/vendor/pagination/**", "resources/views/vendor/notifications/**", "resources/views/vendor/passport/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Taylor Otwell"
SPDX-License-Identifier = "MIT"

# WebAuthn client and views, published from asbiin/laravel-webauthn and then
# adapted for this application's layout and content security policy.
[[annotations]]
path = ["public/vendor/webauthn/**", "resources/views/vendor/webauthn/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Alexis Saettler and the CyberRegister contributors"
SPDX-License-Identifier = "MIT"
